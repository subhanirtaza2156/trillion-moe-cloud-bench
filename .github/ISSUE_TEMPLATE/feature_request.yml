name: Feature request
description: Suggest a useful and safe improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: User problem
      description: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe a focused change and how you would use it.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: Keeps inference remote and avoids local model-weight downloads
        - label: Keeps provider traffic explicit and bounded
        - label: Does not require automatic upload of prompts or results
