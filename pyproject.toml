[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trillion-moe-cloud-bench"
version = "0.2.0"
description = "A lightweight CLI for benchmarking remote OpenAI-compatible large-model inference APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TrillionMoE Cloud Bench contributors" }]
keywords = ["benchmark", "inference", "llm", "mixture-of-experts", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
trillion-bench = "trillion_moe_cloud_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
